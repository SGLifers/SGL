name: Build and release SGL
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric version, e.g. 0.1.0 (creates a draft release)'
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop
        run: dotnet build src/SGL.Desktop/SGL.Desktop.csproj -c Release
      - name: Test statistics parser and durable outbox
        run: dotnet run --project tests/SGL.Statistics.Tests -c Release
      - name: Test core and history
        run: dotnet run --project tests/SGL.Tests -c Release
      - name: Test all audited gamemode controls in isolated folders
        run: dotnet run --project tests/SGL.Desktop.GamemodeChecks -c Release
      - name: Test Mods desktop in isolated folders
        run: dotnet run --project tests/SGL.Desktop.ModChecks -c Release
      - name: Test Hosting without real Discord messages
        run: dotnet run --project tests/SGL.Desktop.HostingChecks -c Release
      - name: Verify pinned UE4SS patch in isolated staging
        run: dotnet run --project tests/SGL.ModRuntimeSmoke -c Release
      - name: Package unsigned verification build
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/package.ps1 -UnsignedMetadata
      - name: Package signed update metadata
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          SGL_UPDATE_PRIVATE_KEY: ${{ secrets.SGL_UPDATE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SGL_UPDATE_PRIVATE_KEY)) { throw 'Configure SGL_UPDATE_PRIVATE_KEY before releasing.' }
          ./scripts/package.ps1 -Version ($env:RELEASE_VERSION -replace '^v','')
      - uses: actions/upload-artifact@v4
        with:
          name: SGL-windows-x64
          path: |
            dist/SGL.exe
            dist/SGL.zip
            dist/update.json
            dist/SHA256SUMS.txt
  draft-release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SGL-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          gh release create "v$version" release/* --draft --title "SGL $version" --generate-notes
