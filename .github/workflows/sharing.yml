name: Validate sharing service
on:
  push:
    branches: [main]
    paths: ['sharing/**', '.github/workflows/sharing.yml']
  pull_request:
    paths: ['sharing/**', '.github/workflows/sharing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment without AWS access
        shell: pwsh
        run: ./sharing/tests/test-deploy.ps1
  sharing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sharing/requirements-dev.txt
      - run: pip install -r sharing/requirements-dev.txt
      - name: Test API, Discord flow and AWS repository
        run: python -m unittest discover -s sharing/tests -v
      - name: Validate CloudFormation
        run: cfn-lint -r us-west-2 -t sharing/infra/template.json
