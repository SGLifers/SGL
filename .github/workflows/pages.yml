name: Publish setup guide
on:
  push:
    branches: [main]
    paths: ['docs/**','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  guide:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN: ${{ github.run_id }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['GH_RUN']}/artifacts?per_page=100"
          for attempt in range(12):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=10) as response:
                  artifacts = json.load(response)["artifacts"]
              if sum(a["name"] == os.environ["EXPECTED_ARTIFACT"] for a in artifacts) == 1:
                  print("Pages artifact metadata is available.")
                  break
              if attempt == 11:
                  raise SystemExit("Pages artifact metadata did not become available.")
              time.sleep(5)
          PY
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
        id: deploy
